<!doctype html><html data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulacro Parcial 2 - Daypo Taller II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one question at a time, centered column, sticky progress bar on top. */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface2:#eceef2;
  --line:#d9dde4;
  --fg:#161a20;
  --muted:#5b6675;
  --accent:#0b6e6e;
  --accent-fg:#ffffff;
  --ok:#1a6b45;
  --ok-bg:#e4f4ec;
  --ok-line:#4ca97d;
  --no:#a32b2b;
  --no-bg:#fbeaea;
  --no-line:#d16a6a;
  --warn:#8a5a0b;
  --warn-bg:#fdf3df;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519;--surface:#1b1f26;--surface2:#242933;--line:#2f353f;--fg:#e6e9ee;--muted:#9aa4b2;
  --accent:#6cc7c0;--accent-fg:#101419;--ok:#7ed6a9;--ok-bg:#15301f;--ok-line:#3e7d5b;
  --no:#f09a9a;--no-bg:#331818;--no-line:#8d4444;--warn:#e8bb70;--warn-bg:#332710;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121519;--surface:#1b1f26;--surface2:#242933;--line:#2f353f;--fg:#e6e9ee;--muted:#9aa4b2;
  --accent:#6cc7c0;--accent-fg:#101419;--ok:#7ed6a9;--ok-bg:#15301f;--ok-line:#3e7d5b;
  --no:#f09a9a;--no-bg:#331818;--no-line:#8d4444;--warn:#e8bb70;--warn-bg:#332710;color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 60px;}
h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:26px 0 8px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px;max-width:56ch}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.opts{display:grid;gap:8px;margin:0 0 18px}
.opt{
  display:flex;gap:11px;align-items:flex-start;
  width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--surface);border:1.5px solid var(--line);border-radius:9px;
  padding:12px 14px;cursor:pointer;min-width:0;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--muted);padding-top:2px;flex:none;width:1.1em}
.opt .v{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--surface2)}
.opt.good{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.good .k{color:var(--ok)}
.opt.bad{border-color:var(--no-line);background:var(--no-bg)}
.opt.bad .k{color:var(--no)}
.opt.dim{opacity:.55}

button{font:inherit;cursor:pointer}
.btn{
  background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);
  border-radius:9px;padding:11px 20px;font-weight:600;font-size:.95rem;
}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  background:var(--surface);border-bottom:1px solid var(--line);
  margin-bottom:18px;padding-block:11px;
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  font-size:.85rem;font-variant-numeric:tabular-nums;
}
.bar b{font-weight:600}
.track{flex:1 1 100px;min-width:60px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.sc-ok{color:var(--ok);font-weight:600}
.sc-no{color:var(--no);font-weight:600}
.bar .quit{margin-left:auto;background:none;border:none;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:0}

.tag{
  display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);background:var(--surface2);padding:3px 9px;border-radius:999px;margin-bottom:10px;
}
.multi{display:inline-block;font-size:.72rem;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:999px;margin:0 0 10px 6px}
.extra{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:999px;margin:0 0 10px 6px}
.round{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:2px 9px;border-radius:999px}
.auto{font-size:.8rem;color:var(--muted)}
.fig{display:block;max-width:100%;max-height:340px;margin:0 0 16px;border-radius:8px;border:1px solid var(--line);background:#fff}
.q{font-size:1.08rem;font-weight:600;line-height:1.45;margin:0 0 16px;overflow-wrap:anywhere}
.verdict{border-radius:9px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.verdict.good{background:var(--ok-bg);border-left:3px solid var(--ok-line)}
.verdict.bad{background:var(--no-bg);border-left:3px solid var(--no-line)}
.verdict b{display:block;margin-bottom:3px}
.verdict.good b{color:var(--ok)}
.verdict.bad b{color:var(--no)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 13px;font-size:.87rem;margin-bottom:14px}
.note b{font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:1px 4px;border-radius:3px}

.modes{display:grid;gap:9px;margin-bottom:20px}
.mode{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;
}
.mode:hover{border-color:var(--accent)}
.mode .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);flex:none}
.mode strong{font-weight:600}
.mode small{display:block;color:var(--muted);font-weight:400;font-size:.83rem;margin-top:2px}

.score{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score small{font-size:.32em;font-weight:500;color:var(--muted);letter-spacing:0}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rev p{margin:0 0 6px;font-weight:600;font-size:.95rem}
.rev .ans{font-size:.9rem;color:var(--ok);margin:0}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<div id="app"></div>

{t:`Simulación y aleatorios`,p:`¿Es posible conseguir la verdadera aleatoriedad?`,ok:[`La verdadera aleatoriedad es imposible de conseguir en una computadora, porque cualquier número obtenido dependerá del algoritmo empleado para generarlo y, por tanto, no puede llegar a ser verdaderamente aleatorio.`],bad:[`Sí, es posible. La verdadera aleatoriedad se consigue simplemente utilizando la hora y la fecha actual del sistema como semilla, ya que este valor cambia constantemente y garantiza una distribución uniforme de los números generados.`,`La verdadera aleatoriedad es fácilmente alcanzable en una computadora siempre que se utilice un algoritmo de cifrado fuerte (como AES o RSA) para generar los números. Estos algoritmos garantizan que el resultado sea impredecible.`]},

const BANK = RAW.map((q,i)=>({...q, id:i, topic:q.t, multi:q.ok.length>1}));
const TOPICS = [...new Set(BANK.map(q=>q.topic))];

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
const LETTERS = "ABCDEFGH";

let run = null;

function start(pool, label, carry){
  const stats = carry || { round: 1, firstRight: 0, firstTotal: pool.length };
  run = {
    label, stats,
    queue: shuffle(pool).map(q => ({
      q,
      opts: shuffle(q.ok.concat(q.bad))
    })),
    i: 0, right: 0, wrong: 0, picked: [], answered: false, failed: [], timer: null
  };
  drawQuestion();
}

function home(){
  if(run) clearTimeout(run.timer);
  run = null;
  const byTopic = TOPICS.map(t => `<button class="mode" type="button" data-topic="${esc(t)}">
      <span><strong>${esc(t)}</strong><small>${BANK.filter(q=>q.topic===t&&!q.e).length} del Daypo · ${BANK.filter(q=>q.topic===t&&q.e).length} extra</small></span>
      <span class="n">${BANK.filter(q=>q.topic===t).length}</span>
    </button>`).join("");
  app.innerHTML = `
    <h1>Simulacro Parcial 2 · Taller II</h1>
    <p class="lead">Basado solo en el Daypo del parcial 2: ${BANK.filter(q=>!q.e).length} preguntas sin repetir, con la respuesta de su clave real. Además hay ${BANK.filter(q=>q.e).length} de teoría que el Daypo no pregunta. Cuando fallás, al final repetís esas hasta sacarlas todas.</p>
    <div class="modes">
      <button class="mode" type="button" data-mode="daypo"><span><strong>Todo el Daypo</strong><small>Las ${BANK.filter(q=>!q.e).length} preguntas del Daypo, mezcladas</small></span><span class="n">${BANK.filter(q=>!q.e).length}</span></button>
      <button class="mode" type="button" data-mode="20"><span><strong>Ronda rápida</strong><small>20 al azar del Daypo</small></span><span class="n">20</span></button>
      <button class="mode" type="button" data-mode="extra"><span><strong>Teoría extra</strong><small>Lo que falta en el Daypo: K y M, bits, código prefijo, Random</small></span><span class="n">${BANK.filter(q=>q.e).length}</span></button>
      <button class="mode" type="button" data-mode="all"><span><strong>Todo junto</strong><small>Daypo + teoría extra</small></span><span class="n">${BANK.length}</span></button>
    </div>
    <h2>Por tema</h2>
    <div class="modes">${byTopic}</div>`;
  app.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    const m = b.dataset.mode;
    if(m === "all") start(BANK, "Todo junto");
    else if(m === "extra") start(BANK.filter(q=>q.e), "Teoría extra");
    else if(m === "daypo") start(BANK.filter(q=>!q.e), "Todo el Daypo");
    else start(shuffle(BANK.filter(q=>!q.e)).slice(0, 20), "Ronda rápida");
  }));
  app.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.topic;
    start(BANK.filter(q => q.topic === t), t);
  }));
}

function drawQuestion(){
  clearTimeout(run.timer);
  const item = run.queue[run.i];
  const q = item.q;
  const total = run.queue.length;
  const pct = Math.round(run.i / total * 100);
  app.innerHTML = `
    <div class="bar">
      <b>${run.i + 1} / ${total}</b>
      ${run.stats.round > 1 ? `<span class="round">Repaso ${run.stats.round - 1}</span>` : ""}
      <span class="track"><i style="width:${pct}%"></i></span>
      <span class="sc-ok">${run.right} ✓</span>
      <span class="sc-no">${run.wrong} ✗</span>
      <button class="quit" type="button" id="quit">Salir</button>
    </div>
    <div class="card">
      <span class="tag">${esc(q.topic)}</span>${q.multi ? `<span class="multi">Marcá ${q.ok.length}</span>` : ""}${q.x ? `<span class="extra">Fuera de apuntes</span>` : ""}${q.e ? `<span class="extra">Teoría extra</span>` : ""}
      <p class="q">${esc(q.p)}</p>${q.img ? `<img class="fig" src="${IMG[q.img]}" alt="Figura de la pregunta">` : ""}
      <div class="opts" id="opts">
        ${item.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">
            <span class="k">${LETTERS[k]}</span><span class="v">${esc(o)}</span>
          </button>`).join("")}
      </div>
      <div id="after"></div>
      <div class="actions" id="controls">
        ${q.multi ? `<button class="btn" type="button" id="check" disabled>Confirmar</button>` : ""}
      </div>
    </div>`;
  document.getElementById("quit").addEventListener("click", home);
  run.picked = [];
  run.answered = false;
  const optsEl = document.getElementById("opts");
  optsEl.addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if(!b || run.answered) return;
    const k = Number(b.dataset.k);
    if(q.multi){
      const at = run.picked.indexOf(k);
      if(at >= 0) run.picked.splice(at, 1);
      else if(run.picked.length < q.ok.length) run.picked.push(k);
      b.classList.toggle("sel", run.picked.includes(k));
      document.getElementById("check").disabled = run.picked.length !== q.ok.length;
    } else {
      run.picked = [k];
      reveal();
    }
  });
  if(q.multi) document.getElementById("check").addEventListener("click", reveal);
  window.scrollTo(0, 0);
}

function reveal(){
  const item = run.queue[run.i];
  const q = item.q;
  run.answered = true;
  const correctIdx = item.opts.map((o, k) => q.ok.includes(o) ? k : -1).filter(k => k >= 0);
  const hit = correctIdx.length === run.picked.length && correctIdx.every(k => run.picked.includes(k));
  if(hit) run.right++; else { run.wrong++; run.failed.push(q); }

  document.querySelectorAll(".opt").forEach(b => {
    const k = Number(b.dataset.k);
    b.disabled = true;
    b.classList.remove("sel");
    if(correctIdx.includes(k)) b.classList.add("good");
    else if(run.picked.includes(k)) b.classList.add("bad");
    else b.classList.add("dim");
  });

  const after = document.getElementById("after");
  after.innerHTML = `
    <div class="verdict ${hit ? "good" : "bad"}">
      <b>${hit ? "Correcto" : "Incorrecto"}</b>
      ${hit ? "Esa es." : "La correcta " + (q.ok.length > 1 ? "son: " : "es: ") + esc(q.ok.join(" · "))}
    </div>
    ${q.n ? `<div class="note"><b>Ojo:</b> ${esc(q.n)}</div>` : ""}`;

  if(run.stats.round === 1 && hit) run.stats.firstRight++;

  const last = run.i === run.queue.length - 1;
  const controls = document.getElementById("controls");
  controls.innerHTML = `<button class="btn" type="button" id="next">${last ? "Ver resultado" : "Siguiente"}</button>
    <span class="auto">tomate el tiempo que quieras, o apretá Enter</span>`;
  const go = () => {
    if(last) results();
    else { run.i++; drawQuestion(); }
  };
  const next = document.getElementById("next");
  next.addEventListener("click", go);
  next.focus();
}

function results(){
  clearTimeout(run.timer);
  const total = run.queue.length;
  const stats = run.stats;
  const pending = run.failed;

  if(pending.length){
    app.innerHTML = `
      <h1>${stats.round === 1 ? "Terminaste la vuelta" : "Repaso " + (stats.round - 1) + " terminado"}</h1>
      <div class="card">
        <div class="score">${run.right}<small> / ${total} en esta vuelta</small></div>
        <p class="lead" style="margin:12px 0 0">Te quedaron <b>${pending.length}</b> sin contestar bien. Las repetís hasta que salgan todas.</p>
      </div>
      <div class="actions" style="margin-bottom:18px">
        <button class="btn" type="button" id="again">Repetir esas ${pending.length}</button>
        <button class="btn ghost" type="button" id="back">Salir</button>
      </div>
      <h2>Las que fallaste</h2>
      <div class="card">${
        pending.map((q, i) => `<div class="rev" ${i === 0 ? 'style="border-top:none;padding-top:0;margin-top:0"' : ""}>
          <p>${esc(q.p)}</p>
          <p class="ans">→ ${esc(q.ok.join(" · "))}</p>
        </div>`).join("")
      }</div>`;
    document.getElementById("again").addEventListener("click", () => {
      start(pending, run.label, { round: stats.round + 1, firstRight: stats.firstRight, firstTotal: stats.firstTotal });
    });
    document.getElementById("back").addEventListener("click", home);
    window.scrollTo(0, 0);
    return;
  }

  const pct = Math.round(stats.firstRight / stats.firstTotal * 100);
  const vueltas = stats.round;
  const msg = pct >= 90 ? "Lo tenés bien agarrado. Repasá de vez en cuando y listo."
            : pct >= 70 ? "Buen nivel. Volvé a correr el simulacro completo en un par de días."
            : pct >= 50 ? "A mitad de camino. Fijate qué tema te costó más y machacá ese."
            : "Todavía falta. Volvé a correrlo entero hasta que la primera vuelta te dé más alto.";
  app.innerHTML = `
    <h1>Todas correctas</h1>
    <div class="card">
      <div class="score">${stats.firstRight}<small> / ${stats.firstTotal} &nbsp;·&nbsp; ${pct}% a la primera</small></div>
      <p class="lead" style="margin:12px 0 0">${
        vueltas === 1 ? "Las sacaste todas en la primera vuelta." :
        "Te llevó " + vueltas + " vueltas dejarlas todas bien."
      } ${msg}</p>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="back">Volver al inicio</button>
    </div>`;
  document.getElementById("back").addEventListener("click", home);
  window.scrollTo(0, 0);
}

document.getElementById("foot").textContent = BANK.length;
home();
</script>

</body></html>
